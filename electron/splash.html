<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>启动中</title>
    <!--
      启动闪屏。作为一个独立的无边框窗口，在「主进程刚起来」到「工作台首屏可显示」
      之间顶上去，避免用户先看到一个空窗口。

      两条硬约束：
      1. 动画全部用 CSS 做，页面里不放 <script>。打包后主进程会注入严格 CSP，
         内联脚本会被拦掉；而 CSS 动画不受影响，即使注入失败闪屏也依然是「活的」。
      2. 启动日志由主进程用 executeJavaScript 追加（不受 CSP 限制），
         这样显示的是真实进度：端口、员工数量、界面加载，而不是假装在跑。

      主进程依赖的挂点（改这个文件时不要动名字）：
        #log        追加 .line / .line.now，只保留最近 4 行
        #bar        写入 style.width 推进进度
        #foot-right 填真实版本号
        body.closing 加这个类时整块淡出

      视觉：地平线网格 + 雷达扫描 + 边缘刻度尺 + HUD 四角 + 六边形核心。
      全部是装饰，不承载任何数据 —— 唯一的进度来源是上面那两个挂点。
    -->
    <style>
      /*
        主题变量。深色值是这套闪屏本来的样子（`:root` 就是深色）；
        [data-theme='light'] 是暖白/纸感的对应版本。

        主题由主进程在 dom-ready 时贴上（它从 userData/theme.json 读用户的选择）——
        这个文件里刻意不放 <script>，见文件头的两条硬约束。贴不上时留在深色，
        也就是加主题之前的样子，不会坏。

        闪屏的颜色**不跟主界面共用一套变量**：那边的 ink 是「表面层级」，
        这边是「一块发光的仪表盘」，浅色下要的是「纸上的墨与橙」而不是把界面
        配色搬过来。所以这里是独立的一组。
      */
      :root {
        --ink-900: #0b0e14;
        --ink-700: #161b28;
        --ink-500: #2a3346;
        --ink-400: #3a4560;
        --boss: #f5a524;
        --boss-dim: #8a5b12;
        --cyan: #35d0e0;

        --stage-bg: var(--stage-bg);
        --stage-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.6),
          0 24px 60px rgba(0, 0, 0, 0.75),
          inset 0 0 90px rgba(245, 165, 36, 0.05);
        --grid-far-line: rgba(245, 165, 36, 0.035);
        --grid-near-line: rgba(245, 165, 36, 0.07);
        --horizon-core: rgba(255, 240, 210, 0.5);
        --crt-line: rgba(255, 255, 255, 0.026);
        --vignette: var(--vignette);
        --bar-tick: rgba(7, 9, 13, 0.85);
        --bar-shine: rgba(255, 255, 255, 0.55);
        --brand-a: #ffffff;
        --brand-b: #ffffff;
        --log-dim: #6b7688;
        --foot: #4a5364;
        --sub-color: rgba(245, 165, 36, 0.62);
      }

      [data-theme='light'] {
        --ink-900: #fffefb;
        --ink-700: #faf8f2;
        --ink-500: #e8e4db;
        --ink-400: #b9b0a0;
        --boss: #e08e0a;
        --boss-dim: #b98a2a;

        --stage-bg: radial-gradient(120% 90% at 50% 8%, #fffdf7 0%, #f7f3ea 46%, #efe9dd 100%);
        --stage-shadow:
          0 0 0 1px rgba(120, 100, 70, 0.12),
          0 20px 48px rgba(120, 100, 70, 0.22),
          inset 0 0 90px rgba(245, 165, 36, 0.06);
        --grid-far-line: rgba(180, 83, 9, 0.07);
        --grid-near-line: rgba(180, 83, 9, 0.13);
        --horizon-core: rgba(180, 83, 9, 0.6);
        --crt-line: rgba(0, 0, 0, 0.025);
        --vignette: radial-gradient(115% 85% at 50% 45%, transparent 42%, rgba(150, 125, 90, 0.26) 100%);
        --bar-tick: rgba(242, 239, 232, 0.9);
        --bar-shine: rgba(255, 255, 255, 0.8);
        --brand-a: #3d2405;
        --brand-b: #3d2405;
        --log-dim: #a8a29e;
        --foot: #a8a29e;
        --sub-color: #b45309;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: 'Microsoft YaHei', 'PingFang SC', Inter, system-ui, sans-serif;
        /* 无边框窗口靠这块区域拖动 */
        -webkit-app-region: drag;
      }

      .stage {
        position: relative;
        height: 100%;
        border-radius: 14px;
        overflow: hidden;
        background: var(--stage-bg);
        border: 1px solid rgba(245, 165, 36, 0.18);
        box-shadow: var(--stage-shadow);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }

      /* 主进程收尾时加这个类，让闪屏淡出而不是硬切 */
      body.closing .stage {
        opacity: 0;
        transform: scale(0.965);
      }

      /* ---------- 背景：远景正交网格 + 近景透视地平线 ---------- */

      /* 远景网格铺满整块，不参与透视，只是「还有更深一层」的暗示 */
      .grid-far {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--grid-far-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-far-line) 1px, transparent 1px);
        background-size: 68px 68px;
        animation: drift 9s linear infinite;
        mask-image: linear-gradient(180deg, #000, transparent 62%);
      }

      @keyframes drift {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 0 68px;
        }
      }

      .grid {
        position: absolute;
        left: -40%;
        right: -40%;
        bottom: -18%;
        height: 78%;
        background-image:
          linear-gradient(var(--grid-near-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-near-line) 1px, transparent 1px);
        background-size: 34px 34px;
        transform: perspective(420px) rotateX(60deg);
        transform-origin: 50% 100%;
        animation: gridpan 3.6s linear infinite;
        mask-image: linear-gradient(180deg, transparent, #000 55%, #000);
      }

      @keyframes gridpan {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 0 34px;
        }
      }

      /* 地平线：网格与远景的交界，让它像一条真的「线」而不是渐隐。
         压在核心后面（top 40%），不要落到底部日志上，否则会切断文字。 */
      .horizon {
        position: absolute;
        left: 0;
        right: 0;
        top: 40%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(245, 165, 36, 0.3) 20%,
          var(--horizon-core) 50%,
          rgba(245, 165, 36, 0.3) 80%,
          transparent
        );
        box-shadow: 0 0 14px rgba(245, 165, 36, 0.22);
        animation: horizonIn 0.9s ease-out both;
      }

      @keyframes horizonIn {
        from {
          opacity: 0;
          transform: scaleX(0.3);
        }
        to {
          opacity: 1;
          transform: scaleX(1);
        }
      }

      .halo {
        position: absolute;
        left: 50%;
        top: 34%;
        width: 460px;
        height: 460px;
        margin: -230px 0 0 -230px;
        background: radial-gradient(circle, rgba(245, 165, 36, 0.16), transparent 62%);
        animation: breathe 3.2s ease-in-out infinite;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }

      .scan {
        position: absolute;
        left: 0;
        right: 0;
        height: 150px;
        top: -150px;
        background: linear-gradient(180deg, transparent, rgba(245, 165, 36, 0.13), transparent);
        animation: scan 2.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      @keyframes scan {
        0% {
          top: -150px;
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          top: 100%;
          opacity: 0;
        }
      }

      .crt {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          180deg,
          var(--crt-line) 0 1px,
          transparent 1px 3px
        );
      }

      /* 每几秒闪一下的横向撕裂，模拟信号不稳 */
      .glitchbar {
        position: absolute;
        left: 0;
        right: 0;
        height: 12px;
        top: 0;
        opacity: 0;
        pointer-events: none;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(53, 208, 224, 0.16),
          rgba(245, 165, 36, 0.2),
          transparent
        );
        animation: tear 5.2s steps(1) infinite;
      }

      @keyframes tear {
        0%,
        89%,
        100% {
          opacity: 0;
          top: 18%;
        }
        90% {
          opacity: 1;
          top: 18%;
        }
        92% {
          opacity: 1;
          top: 63%;
        }
        94% {
          opacity: 0;
          top: 63%;
        }
      }

      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: var(--vignette);
      }

      /* ---------- 边缘刻度尺 ---------- */

      .ruler {
        position: absolute;
        top: 34px;
        bottom: 46px;
        width: 9px;
        opacity: 0.55;
        /* 长刻度每 45px 一根，短刻度每 9px 一根 */
        background-image:
          repeating-linear-gradient(180deg, rgba(245, 165, 36, 0.62) 0 1px, transparent 1px 45px),
          repeating-linear-gradient(180deg, rgba(245, 165, 36, 0.26) 0 1px, transparent 1px 9px);
      }
      .ruler.l {
        left: 8px;
      }
      .ruler.r {
        right: 8px;
      }

      /* ---------- HUD 四角 ---------- */

      .corner {
        position: absolute;
        width: 20px;
        height: 20px;
        border: 1px solid rgba(245, 165, 36, 0.55);
        animation: cornerIn 0.7s ease-out both;
      }
      /* 角上的小方块，让四个角更像瞄准框 */
      .corner::after {
        content: '';
        position: absolute;
        width: 3px;
        height: 3px;
        background: var(--boss);
        box-shadow: 0 0 6px rgba(245, 165, 36, 0.9);
      }
      .corner.tl {
        top: 10px;
        left: 10px;
        border-right: 0;
        border-bottom: 0;
      }
      .corner.tl::after {
        top: 3px;
        left: 3px;
      }
      .corner.tr {
        top: 10px;
        right: 10px;
        border-left: 0;
        border-bottom: 0;
        animation-delay: 0.06s;
      }
      .corner.tr::after {
        top: 3px;
        right: 3px;
      }
      .corner.bl {
        bottom: 10px;
        left: 10px;
        border-right: 0;
        border-top: 0;
        animation-delay: 0.12s;
      }
      .corner.bl::after {
        bottom: 3px;
        left: 3px;
      }
      .corner.br {
        bottom: 10px;
        right: 10px;
        border-left: 0;
        border-top: 0;
        animation-delay: 0.18s;
      }
      .corner.br::after {
        bottom: 3px;
        right: 3px;
      }

      @keyframes cornerIn {
        from {
          opacity: 0;
          transform: scale(0.4);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* ---------- 内容 ---------- */

      .core {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 0 46px;
      }

      .ring {
        position: relative;
        width: 92px;
        height: 92px;
        margin-bottom: -2px;
      }
      .ring svg {
        position: absolute;
        inset: 0;
      }
      .ring .outer {
        animation: spin 9s linear infinite;
        transform-origin: 50% 50%;
      }
      .ring .inner {
        animation: spin 5.5s linear infinite reverse;
        transform-origin: 50% 50%;
      }
      .ring .ticks {
        animation: spin 22s linear infinite reverse;
        transform-origin: 50% 50%;
      }
      /* 雷达弧：一小段亮弧绕核心转。比整块锥形扇收敛得多 —— 锥形扇在
         小窗口里会糊成一大块楔形光斑，看着像渲染瑕疵而不是仪表。 */
      .ring .arc {
        animation: spin 2.6s linear infinite;
        transform-origin: 50% 50%;
      }
      .ring .dash {
        stroke-dasharray: 40 200;
        animation: dash 3s ease-in-out infinite;
      }

      /* SVG 的笔画颜色写在这里而不是 stroke="..." 表现属性上 —— 表现属性不接受
         var()，而这三条线在浅色主题下必须跟着换（否则深灰线落在米色底上会糊掉）。 */
      .ring .rail {
        stroke: var(--ink-500);
      }
      .ring .dash {
        stroke: var(--boss);
      }
      .ring .inner polygon {
        stroke: var(--boss-dim);
      }
      .ring .ticks g {
        stroke: var(--ink-400);
      }
      .ring .arc circle {
        stroke: var(--boss);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes dash {
        0% {
          stroke-dasharray: 30 210;
          stroke-dashoffset: 0;
        }
        50% {
          stroke-dasharray: 120 120;
          stroke-dashoffset: -60;
        }
        100% {
          stroke-dasharray: 30 210;
          stroke-dashoffset: -240;
        }
      }

      .pulse {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        background: var(--boss);
        box-shadow: 0 0 14px 3px rgba(245, 165, 36, 0.75);
        animation: pulse 1.5s ease-in-out infinite;
      }

      /* 核心向外扩散的冲击环，给「正在跑」一点动能 */
      .ping {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 16px;
        height: 16px;
        margin: -8px 0 0 -8px;
        border-radius: 50%;
        border: 1px solid rgba(245, 165, 36, 0.55);
        animation: ping 2.4s cubic-bezier(0.2, 0.7, 0.3, 1) infinite;
      }

      @keyframes ping {
        0% {
          opacity: 0.85;
          transform: scale(0.6);
        }
        70% {
          opacity: 0;
          transform: scale(3.4);
        }
        100% {
          opacity: 0;
          transform: scale(3.4);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.45;
          transform: scale(0.72);
        }
      }

      .brand {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--brand-a);
        background: linear-gradient(100deg, var(--brand-a) 20%, var(--boss) 50%, var(--brand-b) 80%);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation:
          shine 2.6s ease-in-out infinite,
          rise 0.6s ease-out both,
          chroma 6.5s steps(1) infinite;
      }

      @keyframes shine {
        0% {
          background-position: 180% 0;
        }
        100% {
          background-position: -60% 0;
        }
      }

      /* 文字通道错位：靠 text-shadow 在透明字形后面投两层彩边 */
      @keyframes chroma {
        0%,
        91%,
        100% {
          text-shadow: none;
        }
        92% {
          text-shadow: -1.5px 0 rgba(53, 208, 224, 0.8), 1.5px 0 rgba(255, 70, 130, 0.6);
        }
        94% {
          text-shadow: 1.5px 0 rgba(53, 208, 224, 0.65), -1.5px 0 rgba(255, 70, 130, 0.5);
        }
        96% {
          text-shadow: none;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .sub {
        margin-top: -8px;
        font-family: Consolas, 'Cascadia Mono', monospace;
        font-size: 9.5px;
        letter-spacing: 0.34em;
        color: var(--sub-color);
        animation: rise 0.6s 0.1s ease-out both;
      }

      .bar {
        position: relative;
        width: 100%;
        height: 2px;
        background: var(--ink-500);
        overflow: hidden;
        border-radius: 2px;
      }
      /* 每 10px 压一道暗线，进度条读起来像刻度尺而不是一根实心条 */
      .bar::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: repeating-linear-gradient(
          90deg,
          transparent 0 9px,
          var(--bar-tick) 9px 10px
        );
      }
      .bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: linear-gradient(90deg, var(--boss-dim), var(--boss));
        box-shadow: 0 0 10px rgba(245, 165, 36, 0.8);
        transition: width 0.45s cubic-bezier(0.25, 0.9, 0.3, 1);
      }
      .bar-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, var(--bar-shine), transparent);
        animation: shimmer 1.5s linear infinite;
      }

      @keyframes shimmer {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(100%);
        }
      }

      .log {
        width: 100%;
        height: 74px;
        overflow: hidden;
        font-family: Consolas, 'Cascadia Mono', monospace;
        font-size: 10.5px;
        line-height: 1.65;
        color: var(--log-dim);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .log .line {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        animation: logIn 0.28s ease-out both;
      }
      .log .line::before {
        content: '› ';
        color: var(--ink-400);
      }
      .log .line.now {
        color: var(--boss);
      }
      .log .line.now::before {
        content: '› ';
        color: var(--boss);
      }

      @keyframes logIn {
        from {
          opacity: 0;
          transform: translateX(-6px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .foot {
        position: absolute;
        left: 46px;
        right: 46px;
        bottom: 16px;
        display: flex;
        justify-content: space-between;
        font-family: Consolas, 'Cascadia Mono', monospace;
        font-size: 9.5px;
        letter-spacing: 0.12em;
        color: var(--foot);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="grid-far"></div>
      <div class="grid"></div>
      <div class="horizon"></div>
      <div class="halo"></div>
      <div class="scan"></div>
      <div class="crt"></div>
      <div class="glitchbar"></div>
      <div class="vignette"></div>

      <div class="ruler l"></div>
      <div class="ruler r"></div>

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div class="core">
        <div class="ring">
          <svg class="outer" viewBox="0 0 100 100" fill="none">
            <polygon
              points="50,4 92,27 92,73 50,96 8,73 8,27"
              class="rail"
              stroke-width="1"
            />
            <polygon
              class="dash"
              points="50,4 92,27 92,73 50,96 8,73 8,27"
              stroke-width="1.6"
              stroke-linecap="round"
              opacity="0.95"
            />
          </svg>
          <svg class="inner" viewBox="0 0 100 100" fill="none">
            <polygon
              points="50,18 78,34 78,66 50,82 22,66 22,34"
              stroke-width="1"
              stroke-dasharray="4 6"
            />
          </svg>
          <!-- 最外圈刻度环：24 根短线，转得最慢，给核心一个「量程」 -->
          <svg class="ticks" viewBox="0 0 100 100" fill="none">
            <g stroke-width="1">
              <path d="M50 1v6" />
              <path d="M74.5 7.5l-3 5.2" />
              <path d="M93 26l-5.2 3" />
              <path d="M99 50h-6" />
              <path d="M93 74l-5.2-3" />
              <path d="M74.5 92.5l-3-5.2" />
              <path d="M50 99v-6" />
              <path d="M25.5 92.5l3-5.2" />
              <path d="M7 74l5.2-3" />
              <path d="M1 50h6" />
              <path d="M7 26l5.2 3" />
              <path d="M25.5 7.5l3 5.2" />
            </g>
          </svg>
          <!-- 扫掠弧：周长 2πr ≈ 289，dasharray 26/263 只留一小段亮弧 -->
          <svg class="arc" viewBox="0 0 100 100" fill="none">
            <circle
              cx="50"
              cy="50"
              r="46"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-dasharray="26 263"
              opacity="0.8"
            />
          </svg>
          <div class="ping"></div>
          <div class="pulse"></div>
        </div>

        <div class="brand">AI Agent开发控制台</div>
        <div class="sub">CHAOS CONSOLE · MULTI-AGENT RUNTIME</div>

        <div class="bar"><div class="bar-fill" id="bar"></div></div>

        <div class="log" id="log"></div>
      </div>

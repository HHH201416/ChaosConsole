<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>启动中</title>
    <!--
      启动闪屏。作为一个独立的无边框窗口，在「主进程刚起来」到「工作台首屏可显示」
      之间顶上去，避免用户先看到一个空窗口。

      两条硬约束：
      1. 动画全部用 CSS 做，页面里不放 <script>。打包后主进程会注入严格 CSP，
         内联脚本会被拦掉；而 CSS 动画不受影响，即使注入失败闪屏也依然是「活的」。
      2. 启动日志由主进程用 executeJavaScript 追加（不受 CSP 限制），
         这样显示的是真实进度：端口、员工数量、界面加载，而不是假装在跑。
    -->
    <style>
      :root {
        --ink-900: #0b0e14;
        --ink-700: #161b28;
        --ink-500: #2a3346;
        --ink-400: #3a4560;
        --boss: #f5a524;
        --boss-dim: #8a5b12;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: 'Microsoft YaHei', 'PingFang SC', Inter, system-ui, sans-serif;
        /* 无边框窗口靠这块区域拖动 */
        -webkit-app-region: drag;
      }

      .stage {
        position: relative;
        height: 100%;
        border-radius: 14px;
        overflow: hidden;
        background: radial-gradient(120% 90% at 50% 8%, #141b2b 0%, #0c1017 46%, #07090d 100%);
        border: 1px solid rgba(245, 165, 36, 0.18);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.6),
          0 24px 60px rgba(0, 0, 0, 0.75),
          inset 0 0 90px rgba(245, 165, 36, 0.05);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }

      /* 主进程收尾时加这个类，让闪屏淡出而不是硬切 */
      body.closing .stage {
        opacity: 0;
        transform: scale(0.965);
      }

      /* ---------- 背景：透视网格 + 扫描线 + CRT 细纹 ---------- */

      .grid {
        position: absolute;
        left: -40%;
        right: -40%;
        bottom: -18%;
        height: 78%;
        background-image:
          linear-gradient(rgba(245, 165, 36, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(245, 165, 36, 0.07) 1px, transparent 1px);
        background-size: 34px 34px;
        transform: perspective(420px) rotateX(60deg);
        transform-origin: 50% 100%;
        animation: gridpan 3.6s linear infinite;
        mask-image: linear-gradient(180deg, transparent, #000 55%, #000);
      }

      @keyframes gridpan {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 0 34px;
        }
      }

      .halo {
        position: absolute;
        left: 50%;
        top: 34%;
        width: 460px;
        height: 460px;
        margin: -230px 0 0 -230px;
        background: radial-gradient(circle, rgba(245, 165, 36, 0.16), transparent 62%);
        animation: breathe 3.2s ease-in-out infinite;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }

      .scan {
        position: absolute;
        left: 0;
        right: 0;
        height: 150px;
        top: -150px;
        background: linear-gradient(180deg, transparent, rgba(245, 165, 36, 0.13), transparent);
        animation: scan 2.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      @keyframes scan {
        0% {
          top: -150px;
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          top: 100%;
          opacity: 0;
        }
      }

      .crt {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.026) 0 1px,
          transparent 1px 3px
        );
      }

      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(115% 85% at 50% 45%, transparent 42%, rgba(0, 0, 0, 0.72) 100%);
      }

      /* ---------- HUD 四角 ---------- */

      .corner {
        position: absolute;
        width: 20px;
        height: 20px;
        border: 1px solid rgba(245, 165, 36, 0.55);
        animation: cornerIn 0.7s ease-out both;
      }
      .corner.tl {
        top: 10px;
        left: 10px;
        border-right: 0;
        border-bottom: 0;
      }
      .corner.tr {
        top: 10px;
        right: 10px;
        border-left: 0;
        border-bottom: 0;
        animation-delay: 0.06s;
      }
      .corner.bl {
        bottom: 10px;
        left: 10px;
        border-right: 0;
        border-top: 0;
        animation-delay: 0.12s;
      }
      .corner.br {
        bottom: 10px;
        right: 10px;
        border-left: 0;
        border-top: 0;
        animation-delay: 0.18s;
      }

      @keyframes cornerIn {
        from {
          opacity: 0;
          transform: scale(0.4);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* ---------- 内容 ---------- */

      .core {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 0 46px;
      }

      .ring {
        position: relative;
        width: 92px;
        height: 92px;
        margin-bottom: -2px;
      }
      .ring svg {
        position: absolute;
        inset: 0;
      }
      .ring .outer {
        animation: spin 9s linear infinite;
        transform-origin: 50% 50%;
      }
      .ring .inner {
        animation: spin 5.5s linear infinite reverse;
        transform-origin: 50% 50%;
      }
      .ring .dash {
        stroke-dasharray: 40 200;
        animation: dash 3s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes dash {
        0% {
          stroke-dasharray: 30 210;
          stroke-dashoffset: 0;
        }
        50% {
          stroke-dasharray: 120 120;
          stroke-dashoffset: -60;
        }
        100% {
          stroke-dasharray: 30 210;
          stroke-dashoffset: -240;
        }
      }

      .pulse {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        background: var(--boss);
        box-shadow: 0 0 14px 3px rgba(245, 165, 36, 0.75);
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.45;
          transform: scale(0.72);
        }
      }

      .brand {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #fff;
        background: linear-gradient(100deg, #ffffff 20%, var(--boss) 50%, #ffffff 80%);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 2.6s ease-in-out infinite, rise 0.6s ease-out both;
      }

      @keyframes shine {
        0% {
          background-position: 180% 0;
        }
        100% {
          background-position: -60% 0;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .sub {
        margin-top: -8px;
        font-family: Consolas, 'Cascadia Mono', monospace;
        font-size: 9.5px;
        letter-spacing: 0.34em;
        color: rgba(245, 165, 36, 0.62);
        animation: rise 0.6s 0.1s ease-out both;
      }

      .bar {
        position: relative;
        width: 100%;
        height: 2px;
        background: var(--ink-500);
        overflow: hidden;
        border-radius: 2px;
      }
      .bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: linear-gradient(90deg, var(--boss-dim), var(--boss));
        box-shadow: 0 0 10px rgba(245, 165, 36, 0.8);
        transition: width 0.45s cubic-bezier(0.25, 0.9, 0.3, 1);
      }
      .bar-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
        animation: shimmer 1.5s linear infinite;
      }

      @keyframes shimmer {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(100%);
        }
      }

      .log {
        width: 100%;
        height: 74px;
        overflow: hidden;
        font-family: Consolas, 'Cascadia Mono', monospace;
        font-size: 10.5px;
        line-height: 1.65;
        color: #6b7688;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .log .line {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        animation: logIn 0.28s ease-out both;
      }
      .log .line::before {
        content: '› ';
        color: var(--ink-400);
      }
      .log .line.now {
        color: var(--boss);
      }
      .log .line.now::before {
        content: '› ';
        color: var(--boss);
      }

      @keyframes logIn {
        from {
          opacity: 0;
          transform: translateX(-6px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .foot {
        position: absolute;
        left: 46px;
        right: 46px;
        bottom: 16px;
        display: flex;
        justify-content: space-between;
        font-family: Consolas, 'Cascadia Mono', monospace;
        font-size: 9.5px;
        letter-spacing: 0.12em;
        color: #4a5364;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="grid"></div>
      <div class="halo"></div>
      <div class="scan"></div>
      <div class="crt"></div>
      <div class="vignette"></div>

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div class="core">
        <div class="ring">
          <svg class="outer" viewBox="0 0 100 100" fill="none">
            <polygon
              points="50,4 92,27 92,73 50,96 8,73 8,27"
              stroke="#2a3346"
              stroke-width="1"
            />
            <polygon
              class="dash"
              points="50,4 92,27 92,73 50,96 8,73 8,27"
              stroke="#f5a524"
              stroke-width="1.6"
              stroke-linecap="round"
              opacity="0.95"
            />
          </svg>
          <svg class="inner" viewBox="0 0 100 100" fill="none">
            <polygon
              points="50,18 78,34 78,66 50,82 22,66 22,34"
              stroke="#8a5b12"
              stroke-width="1"
              stroke-dasharray="4 6"
            />
          </svg>
          <div class="pulse"></div>
        </div>

        <div class="brand">AI Agent开发控制台</div>
        <div class="sub">CHAOS CONSOLE · MULTI-AGENT RUNTIME</div>

        <div class="bar"><div class="bar-fill" id="bar"></div></div>

        <div class="log" id="log"></div>
      </div>

      <div class="foot">
        <span id="foot-left">BOOT SEQUENCE</span>
        <span id="foot-right">v—</span>
      </div>
    </div>
  </body>
</html>

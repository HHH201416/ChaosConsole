<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP 由 Electron 主进程按环境注入（见 electron/main.js）：
         开发模式下 Vite 会注入内联的 HMR 脚本，写死严格 CSP 会打断热更新。 -->
    <title>AI Agent开发控制台</title>
    <!-- 主题引导。同步加载 = 阻塞解析，保证首帧就是正确的主题，不会先闪一下深色。
         放在 <head> 里、且在所有 module 脚本之前。
         是独立文件不是内联脚本：打包后的 CSP 是 `script-src 'self'`，内联会被拦。
         源文件在 public/theme-boot.js。 -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
